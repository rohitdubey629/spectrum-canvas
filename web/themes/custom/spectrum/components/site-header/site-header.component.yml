$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Site header
status: stable
group: 'Spectrum: Global'
description: Global header with logo, main navigation (with dropdowns), an optional utility area and a call-to-action button. Place it once at the top of the Canvas page template. On mobile the menu collapses behind a toggle button.
props:
  type: object
  required:
    - site_name
  properties:
    site_name:
      type: string
      title: Site name
      description: Shown when no logo is set, and used as the logo's alt text. Links to the homepage.
      maxLength: 60
      examples:
        - Spectrum Clone
    logo:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Logo
      description: Optional logo. A wide image about 40px tall works best.
      examples:
        - src: https://placehold.co/240x60/0b2a4a/ffffff.png?text=SPECTRUM
          alt: Spectrum Clone
          width: 240
          height: 60
    button_text:
      type: string
      title: Button text
      description: Label of the button on the right. Leave empty to hide the button.
      examples:
        - Contact us
    button_url:
      type: string
      format: uri-reference
      title: Button link
      description: Internal path (e.g. /contact) or full URL.
      examples:
        - /contact
    sticky:
      type: boolean
      title: Stick to top on scroll
      description: Keep the header visible while the page scrolls.
      default: true
      examples:
        - true
slots:
  navigation:
    title: Navigation
    description: Drop the "Main navigation" menu block here. Set "Number of levels to display" to 2 and turn on "Expand all menu links" so dropdowns get their links.
  utility:
    title: Utility area
    description: Optional small links shown before the button, such as a phone number or search.
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
